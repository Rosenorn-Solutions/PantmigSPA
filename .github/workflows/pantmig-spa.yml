name: Pantmig SPA CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: pantmig-spa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build (Next.js)
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: Development
    steps:
      - name: Deploy via SSH (git pull, build, restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_NAME }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_ROOT_CERTIFICATE }}
          envs: GITHUB_SHA
          script: |
            set -e
            APP_DIR="/var/www/pantmig/spa/PantmigSPA"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is not a git repository. Please clone the repo there first." >&2
              exit 1
            fi
            cd "$APP_DIR"
            echo "===> Git fetch/reset"
            git fetch --prune origin
            git checkout -f main
            if [ -n "$GITHUB_SHA" ]; then
              git reset --hard "$GITHUB_SHA"
            else
              git reset --hard origin/main
            fi

            echo "===> Clean install & build"
            rm -rf node_modules .next
            npm ci
            npm run build

            echo "===> Fix permissions (if needed)"
            if id github-actions >/dev/null 2>&1; then
              sudo chown -R github-actions:github-actions "$APP_DIR" || true
            fi

            echo "===> Restart service"
            sudo systemctl daemon-reload || true
            sudo systemctl restart pantmigspa.service
            sudo systemctl status pantmigspa.service --no-pager || true