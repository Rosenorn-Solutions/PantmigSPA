name: Pantmig SPA CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: pantmig-spa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build (Next.js)
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive (exclude build artifacts)
        run: |
          set -e
          TAR_FLAGS="--warning=no-file-changed --ignore-failed-read"
          tar -czf source.tar.gz $TAR_FLAGS \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            .

      - name: Upload source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_NAME }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_ROOT_CERTIFICATE }}
          passphrase: ${{ secrets.SERVER_ROOT_CERTIFICATE_PASSWORD }}
          source: "source.tar.gz"
          target: "/var/www/pantmig/spa/PantmigSPA/"

      - name: Extract, build, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_NAME }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_ROOT_CERTIFICATE }}
          passphrase: ${{ secrets.SERVER_ROOT_CERTIFICATE_PASSWORD }}
          script: |
            set -e
            APP_DIR="/var/www/pantmig/spa/PantmigSPA"
            cd "$APP_DIR"
            echo "===> Extracting source"
            test -f source.tar.gz || { echo "source.tar.gz not found at $APP_DIR" >&2; exit 1; }
            # Remove previous app files except env files and node_modules cache
            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name node_modules \
              ! -name .env.local \
              ! -name .env.production \
              ! -name source.tar.gz \
              -exec rm -rf {} +
            tar -xzf source.tar.gz
            rm -f source.tar.gz

            echo "===> Install & build"
            npm ci
            npm run build

            echo "===> Fix ownership and permissions for service"
            sudo chown -R pantmigservice:pantmigservice "$APP_DIR" || true
            sudo chmod -R a+rX "$APP_DIR" || true

            echo "===> Restart service"
            sudo systemctl daemon-reload || true
            sudo systemctl restart pantmigspa.service
            sudo systemctl status pantmigspa.service --no-pager || true